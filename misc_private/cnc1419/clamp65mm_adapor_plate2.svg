<?xml version="1.0" standalone="no"?>
<svg id="clamp65mm-adaptor-plate" width="140mm" height="140mm" viewBox="0 0 140 140" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
	<!--
    clamp has an height of 40mm, 
       horizontal distance between screws : 80 mm
       vertical   distance between screws : 25 mm 
    -->
    <defs id="defs">
        <circle id="plate_screw_3mm" style="fill:#ff0000;fill-opacity:1" cx="0" cy="0" r="1.5" />
        <circle id="clamp_screw_8mm" style="fill:#008080;fill-opacity:1" cx="0" cy="0" r="3.25" />
    </defs>
  
    <g id="full_plate1">
	    <rect id="plate1"      x="0" y="0"  rx="1" ry="1" width="100" height="60" stroke="blue"  stroke-width="0.25" fill="none" /> 
        <rect id="clamp_base1" x="0" y="10" rx="2" ry="2" width="100" height="40" stroke="black" stroke-width="0.25" fill="none" /> 

		<use href="#plate_screw_3mm"    x="20" y="20" id="s1a" />
        <use href="#plate_screw_3mm"    x="20" y="40" id="s1b" />
        <use href="#plate_screw_3mm"    x="50" y="20" id="s2a" />
        <use href="#plate_screw_3mm"    x="50" y="40" id="s2b" />
        <use href="#plate_screw_3mm"    x="80" y="20" id="s3a" />
        <use href="#plate_screw_3mm"    x="80" y="40" id="s3b" />
		  
	    <use href="#clamp_screw_8mm"    x="10" y="17.5" id="clamp_s1a" />
        <use href="#clamp_screw_8mm"    x="10" y="42.5" id="clamp_s2a" />
        <use href="#clamp_screw_8mm"    x="90" y="17.5" id="clamp_s3a" />
        <use href="#clamp_screw_8mm"    x="90" y="42.5" id="clamp_s4a" />
    </g>

    <g id="full_plate2" transform="translate(0,70)">
	    <rect id="plate2"      x="0" y="0" rx="1" ry="1" width="100" height="60" stroke="blue"  stroke-width="0.25" fill="none" /> 
        <rect id="clamp_base2" x="0" y="5" rx="2" ry="2" width="100" height="50" stroke="black" stroke-width="0.25" fill="none" /> 

        <use href="#plate_screw_3mm"    x="22.5" y="20" id="s1c" />
        <use href="#plate_screw_3mm"    x="22.5" y="40" id="s1d" />
		<use href="#plate_screw_3mm"    x="50.0" y="20" id="s2c" />
        <use href="#plate_screw_3mm"    x="50.0" y="40" id="s2d" />
        <use href="#plate_screw_3mm"    x="77.5" y="20" id="s3c" />
        <use href="#plate_screw_3mm"    x="77.5" y="40" id="s3d" />
		  
	    <use href="#clamp_screw_8mm"    x="10" y="15" id="clamp_s1c" />
        <use href="#clamp_screw_8mm"    x="10" y="45" id="clamp_s2c" />
        <use href="#clamp_screw_8mm"    x="90" y="15" id="clamp_s3c" />
        <use href="#clamp_screw_8mm"    x="90" y="45" id="clamp_s4c" />
    </g>	
</svg>
