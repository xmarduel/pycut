# Support Python 3.12+.
target-version = "py312"
# Set the maximum line length to 79.
#line-length = 79

[lint]
# Add the `line-too-long` rule to the enforced rule set.
#extend-select = ["E501"]

# BLE001 Do not catch blind exception: `Exception`

# B008 Do not perform function call `QtCore.QModelIndex` in argument defaults; instead, perform the call within the function, or read the default from a module-level singleton variable
# B009 [*] Do not call `getattr` with a constant attribute value. It is not any safer than normal property access.
# B023 Function definition does not bind loop variable `total_time`

# D419 Docstring is empty

# F841 Local variable `ALLOW_DND` is assigned to but never used

# FURB136 [*] Replace `b if b > 0.0 else 0.0` with `max(0.0, b)`

# I001 [*] Import block is un-sorted or un-formatted

# PERF402 Use `list` or `list.copy` to create a copy of a list
# PIE790: Unnecessary `pass` statement
# PIE808 [*] Unnecessary `start` argument in `range`

# PLR0402 [*] Use `from lxml import etree` in lieu of alias
# PLR1711 [*] Useless `return` statement at end of function
# PLR1730 [*] Replace `if` statement with `calculated_default = min(calculated_default, amax)`

# RUF012 Mutable default value for class attribute
# RUF015 Prefer `next(iter(possibleContainersAndTags.values()))` over single element slice
# RUF059 Unpacked variable `tag` is never used

# S110 `try`-`except`-`pass` detected, consider logging the exception

# SIM102 Use a single `if` statement instead of nested `if` statements
# SIM114 [*] Combine `if` branches using logical `or` operator
# SIM115 Use a context manager for opening files
# SIM210 Use `bool(...)` instead of `True if ... else False`
# SIM222 Use `True` instead of `... or True`
# SIM223 Use `False` instead of `False and ...`

# UP006 [*] Use `dict` instead of `Dict` for type annotation
# UP009 [*] UTF-8 encoding declaration is unnecessary
# UP031 Use format specifiers instead of percent format
# UP032 [*] Use f-string instead of `format` call
# UP035 `typing.Dict` is deprecated, use `dict` instead
# UP037 [*] Remove quotes from type annotation
# UP045 [*] Use `X | None` for type annotations

ignore = [
    "B008", "B018", "B023", "BLE001",
    "D419",
    "F841",
    "FURB136",
    "I001",
    "PERF402",
    "PIE790", 
    "PLR0402", "PLR1711", "PLR1730",
    "RUF012", "RUF015", "RUF059",
    "S110",
    "SIM102", "SIM114", "SIM115", "SIM210", "SIM222", "SIM223",
    "UP006", "UP009", "UP031", "UP032", "UP035", "UP037", "UP045"
]

